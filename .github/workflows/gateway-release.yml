name: gateway-release

on:
  push:
    tags:
      - "gateway-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go.sum
      - name: Test
        run: go test ./...
      - name: Build Windows x64
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#gateway-v}"
          mkdir -p dist/pkg/scripts
          GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION}" \
            -o dist/gateway.exe ./cmd/gateway
          cp dist/gateway.exe config.example.json opencode-gateway.vbs publickey.txt README.md dist/pkg/
          cp scripts/install.ps1 scripts/install-wsl.ps1 scripts/uninstall.ps1 scripts/upgrade.ps1 dist/pkg/scripts/
          (cd dist/pkg && zip -qr ../opencode-gateway-win-x64.zip .)
          SHA="$(sha256sum dist/gateway.exe | awk '{print $1}')"
          ASSET="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/gateway.exe"
          if [ -z "${GATEWAY_SIGNING_KEY:-}" ]; then
            echo "GATEWAY_SIGNING_KEY secret is required" >&2
            exit 1
          fi
          printf '%s\n' "$GATEWAY_SIGNING_KEY" > /tmp/signing.key
          go run ./cmd/keytool sign /tmp/signing.key "$VERSION" "$SHA" "$ASSET" dist/latest.json
          rm -f /tmp/signing.key
        env:
          GATEWAY_SIGNING_KEY: ${{ secrets.GATEWAY_SIGNING_KEY }}
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: "Gateway ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            dist/opencode-gateway-win-x64.zip
            dist/gateway.exe
            dist/latest.json
